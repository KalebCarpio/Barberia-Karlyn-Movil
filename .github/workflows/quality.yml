name: Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Las acciones se fijan por hash de commit (el comentario indica su version) para que no cambien sin revision.
jobs:
  # Prueba de seguridad SAST: analisis estatico del codigo fuente antes de instalar, compilar o probar.
  # Reglas de JavaScript/TypeScript, React, secretos expuestos (tokens, llaves) y OWASP Top 10.
  # Solo los hallazgos de severidad ERROR (criticos) detienen el pipeline; el resto se reporta.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Analisis SAST
        run: >
          semgrep scan
          --config p/javascript --config p/typescript --config p/react
          --config p/secrets --config p/owasp-top-ten
          --exclude node_modules --exclude dist
          --metrics=off
          --json-output=semgrep.json --sarif-output=semgrep.sarif
      # Muestra el resultado en el resumen de la ejecucion y falla si hay hallazgos criticos.
      - name: Resultado SAST
        run: python3 .github/scripts/semgrep-summary.py semgrep.json
      # Publica los hallazgos en la pestana Security del repositorio (sin generar artifacts).
      - name: Publicar en Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  quality:
    name: TypeScript and Expo checks
    needs: sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Prueba estatica: tipos de TypeScript en la app y en las pruebas.
      - name: Typecheck
        run: npm run typecheck
      # Pruebas unitarias (caja blanca): dominio, ApiClient, SessionStore, ModelFactory y ViewModels
      # con los datos de prueba de test/fixtures y Repositories falsos. No usan red.
      - name: Pruebas unitarias
        run: npm run test:unit -- --ci
      # Pruebas de integracion REST API: Repositories con fetch simulado; validan endpoint,
      # token, respuesta con datos, respuesta vacia, error de API y falla de red.
      - name: Pruebas de integracion REST API
        run: npm run test:integration -- --ci
      # Compatibilidad de dependencias con la version de Expo SDK.
      - name: Expo Doctor
        run: npx --yes expo-doctor@latest
